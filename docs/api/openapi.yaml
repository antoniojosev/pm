openapi: 3.0.3
info:
  title: pm HTTP API
  version: "1"
  description: |
    Local HTTP API of the pm daemon (default http://127.0.0.1:9797). It listens
    on loopback only and has no authentication.

    Every route lives under `/api/v1`. The unversioned `/api/...` paths are a
    deprecated alias kept during v0.2: they answer identically and add
    `Deprecation: @1791763200` (RFC 9745: a Structured Field Date, here
    2026-10-12) and `Link: <...>; rel="successor-version"` headers.

    Errors are `{"error": "<message>"}` with HTTP 400 (the daemon does not
    distinguish error classes yet).

    This file is the contract. `TestRoutesMatchOpenAPI` (internal/daemon) fails
    when a route is added or removed in code without updating it, and the
    other way round.
  license:
    name: MIT
servers:
  - url: http://127.0.0.1:9797/api/v1
tags:
  - name: system
  - name: projects
  - name: processes
  - name: groups
  - name: leases
  - name: discovery
  - name: streams
paths:
  /health:
    get:
      tags: [system]
      operationId: health
      summary: Liveness probe
      responses:
        "200":
          description: Daemon is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, example: ok}
  /version:
    get:
      tags: [system]
      operationId: version
      summary: Version, API generation and host capabilities
      description: |
        Lets a client check it speaks the same API generation before using
        anything else, and decide what it can ask for. The capability flags
        are probed on every call.
      responses:
        "200":
          description: Build identity and capabilities.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Version"}
  /ps:
    get:
      tags: [processes]
      operationId: ps
      summary: Everything listening, attributed to projects where possible
      description: Registered projects (up or down) plus unclaimed listeners.
      responses:
        "200":
          description: One row per project or listener.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Row"}
        "400": {$ref: "#/components/responses/Error"}
  /projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: List registered projects
      responses:
        "200":
          description: The registry catalog.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Project"}
    post:
      tags: [projects]
      operationId: upsertProject
      summary: Register or update a project
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProjectInput"}
      responses:
        "200":
          description: |
            The request body echoed back exactly as sent, without the defaults
            the daemon applies when storing (`kind` defaults to `native` and
            `tier` to `ephemeral`; omitted fields come back empty or `null`).
            Read the stored project with `GET /projects`.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectEcho"}
        "400": {$ref: "#/components/responses/Error"}
  /projects/{name}:
    parameters:
      - {$ref: "#/components/parameters/Name"}
    delete:
      tags: [projects]
      operationId: deleteProject
      summary: Remove a project from the registry
      responses:
        "200": {$ref: "#/components/responses/OK"}
        "400": {$ref: "#/components/responses/Error"}
  /run:
    post:
      tags: [processes]
      operationId: run
      summary: Start a process from a specification, without registering it
      description: |
        Launches `cmd` as the transient systemd unit `pm-<name>.service`, in
        `dir`, with `env` added and `limits` applied. The process is not added
        to the catalog: it shows in `GET /ps` as an `ephemeral` row with its
        `owner` while it lives, `POST /projects/{name}/stop` stops it, and
        stopping it forgets it, so nothing of it is left in the listing. It
        cannot be started, restarted or promoted by name: run it again.

        `ports` are the ports the process will use, typically those of a
        lease. pm does not hand them to the process (put them in `env` or in
        `cmd`, the way the stack wants them). It checks that each is free,
        with no listener and a test bind that succeeds, and that none is
        leased to a different owner or declared by another run. While the run
        exists, other leases and the ports pm picks on its own avoid them.
        `GET /ps` reports the first one as the row's `port`, even before the
        process binds it.

        `name` must be free: a registered project or a run that is still alive
        refuses it, while the record of a run that already exited is replaced.
        The request body is strict: an unknown field is a 400. The environment
        is handed to systemd and never stored by pm.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RunSpec"}
      responses:
        "200":
          description: The unit that was started.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunResult"}
        "400": {$ref: "#/components/responses/Error"}
  /projects/{name}/start:
    parameters:
      - {$ref: "#/components/parameters/Name"}
      - {$ref: "#/components/parameters/Port"}
      - {$ref: "#/components/parameters/Force"}
    post:
      tags: [processes]
      operationId: startProject
      summary: Start a registered project
      responses:
        "200": {$ref: "#/components/responses/Launch"}
        "400": {$ref: "#/components/responses/Error"}
  /projects/{name}/stop:
    parameters:
      - {$ref: "#/components/parameters/Name"}
    post:
      tags: [processes]
      operationId: stopProject
      summary: Stop a project started by pm
      responses:
        "200": {$ref: "#/components/responses/OK"}
        "400": {$ref: "#/components/responses/Error"}
  /projects/{name}/restart:
    parameters:
      - {$ref: "#/components/parameters/Name"}
      - {$ref: "#/components/parameters/Port"}
      - {$ref: "#/components/parameters/Force"}
    post:
      tags: [processes]
      operationId: restartProject
      summary: Stop then start a project
      responses:
        "200": {$ref: "#/components/responses/Launch"}
        "400": {$ref: "#/components/responses/Error"}
  /projects/{name}/promote:
    parameters:
      - {$ref: "#/components/parameters/Name"}
    post:
      tags: [projects]
      operationId: promoteProject
      summary: Make a project a persistent systemd --user service
      responses:
        "200": {$ref: "#/components/responses/OK"}
        "400": {$ref: "#/components/responses/Error"}
  /projects/{name}/demote:
    parameters:
      - {$ref: "#/components/parameters/Name"}
    post:
      tags: [projects]
      operationId: demoteProject
      summary: Turn a persistent service back into an ephemeral project
      responses:
        "200": {$ref: "#/components/responses/OK"}
        "400": {$ref: "#/components/responses/Error"}
  /projects/{name}/logs:
    parameters:
      - {$ref: "#/components/parameters/Name"}
    get:
      tags: [processes]
      operationId: projectLogs
      summary: Last lines of a project's log
      parameters:
        - name: n
          in: query
          description: Number of lines to return.
          schema: {type: integer, default: 200}
      responses:
        "200":
          description: Log tail.
          content:
            application/json:
              schema:
                type: object
                required: [logs]
                properties:
                  logs: {type: string}
        "400": {$ref: "#/components/responses/Error"}
  /claim:
    post:
      tags: [discovery]
      operationId: claim
      summary: Adopt whatever listens on a port into the registry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [port, name]
              properties:
                port: {type: integer}
                name: {type: string}
      responses:
        "200":
          description: The project created from the listener.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Project"}
        "400": {$ref: "#/components/responses/Error"}
  /scan:
    post:
      tags: [discovery]
      operationId: scan
      summary: Register draft projects found under the configured roots
      responses:
        "200":
          description: Projects added by this scan (existing names are skipped).
          content:
            application/json:
              schema:
                type: array
                nullable: true
                items: {$ref: "#/components/schemas/Project"}
        "400": {$ref: "#/components/responses/Error"}
  /groups:
    get:
      tags: [groups]
      operationId: listGroups
      summary: List groups
      responses:
        "200":
          description: All groups.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Group"}
    post:
      tags: [groups]
      operationId: upsertGroup
      summary: Create or replace a group
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Group"}
      responses:
        "200":
          description: The stored group.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Group"}
        "400": {$ref: "#/components/responses/Error"}
  /groups/{name}:
    parameters:
      - {$ref: "#/components/parameters/Name"}
    delete:
      tags: [groups]
      operationId: deleteGroup
      summary: Delete a group (its projects stay registered)
      responses:
        "200": {$ref: "#/components/responses/OK"}
        "400": {$ref: "#/components/responses/Error"}
  /groups/{name}/up:
    parameters:
      - {$ref: "#/components/parameters/Name"}
    post:
      tags: [groups]
      operationId: groupUp
      summary: Start every project of a group
      responses:
        "200":
          description: One launch result per project.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/LaunchResult"}
        "400": {$ref: "#/components/responses/Error"}
  /groups/{name}/down:
    parameters:
      - {$ref: "#/components/parameters/Name"}
    post:
      tags: [groups]
      operationId: groupDown
      summary: Stop every project of a group
      responses:
        "200": {$ref: "#/components/responses/OK"}
        "400": {$ref: "#/components/responses/Error"}
  /leases:
    get:
      tags: [leases]
      operationId: listLeases
      summary: List port leases
      parameters:
        - name: owner
          in: query
          description: Only the leases of this owner (case-insensitive).
          schema: {type: string}
      responses:
        "200":
          description: Leases, oldest first. An empty array when there are none.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Lease"}
    post:
      tags: [leases]
      operationId: createLease
      summary: Reserve ports for an owner
      description: |
        Reserves `count` ports without starting anything. A port is handed out
        only when no listener holds it, a test bind on every interface
        succeeds (so a port `ss` does not show still counts as taken) and no
        other lease has it. Choosing the ports and recording the lease is one
        atomic step: two simultaneous requests never receive the same port.

        The lease does not open the port; the owner's process binds it later.
        Until the lease is released, pm marks its ports as taken for other
        leases and for the ports pm picks on its own when it starts a project.
        An explicit port (`?port=`, `--port`) is still honoured, since pm cannot
        tell whether the caller owns the lease.

        Release it with `DELETE /leases/{id}`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LeaseRequest"}
      responses:
        "200":
          description: The lease and its ports, ascending.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Lease"}
        "400": {$ref: "#/components/responses/Error"}
  /leases/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, example: l-3f9a1c0b7d2e}
    delete:
      tags: [leases]
      operationId: releaseLease
      summary: Release a lease
      description: Frees its ports. An unknown id is a 400.
      responses:
        "200": {$ref: "#/components/responses/OK"}
        "400": {$ref: "#/components/responses/Error"}
  /events:
    get:
      tags: [streams]
      operationId: events
      summary: Live state (Server-Sent Events)
      description: |
        Emits the `/ps` array as one JSON `data:` event (an unnamed event, the
        one `EventSource.onmessage` receives) immediately and then every 2
        seconds, until the client disconnects.

        Changes arrive as named events whose `data:` is the JSON of the
        object concerned:

        - `lease.created`: a lease was taken; `data` is the `Lease`.
        - `lease.released`: a lease was released; `data` is the `Lease` as it
          was.

        A lease change made through the daemon is sent at once; one made by
        another process (the `pm lease` CLI) within 2 seconds. Only changes
        after the client connected are sent: read `GET /leases` for the
        starting point.
      responses:
        "200":
          description: SSE stream.
          content:
            text/event-stream:
              schema: {type: string}
  /logs/stream:
    get:
      tags: [streams]
      operationId: logStream
      summary: Tail a project's log (Server-Sent Events)
      parameters:
        - name: name
          in: query
          required: true
          description: Project name.
          schema: {type: string}
      responses:
        "200":
          description: SSE stream, one `data:` event per log line.
          content:
            text/event-stream:
              schema: {type: string}
  /instances/{port}/stop:
    parameters:
      - {$ref: "#/components/parameters/PortPath"}
    post:
      tags: [processes]
      operationId: stopInstance
      summary: Stop whatever listens on a port
      responses:
        "200": {$ref: "#/components/responses/OK"}
        "400": {$ref: "#/components/responses/Error"}
  /instances/{port}/restart:
    parameters:
      - {$ref: "#/components/parameters/PortPath"}
    post:
      tags: [processes]
      operationId: restartInstance
      summary: Restart whatever listens on a port
      responses:
        "200": {$ref: "#/components/responses/Launch"}
        "400": {$ref: "#/components/responses/Error"}
  /fs:
    get:
      tags: [discovery]
      operationId: browse
      summary: List sub-directories of a path
      parameters:
        - name: path
          in: query
          description: Directory to list. Defaults to the first scan root, else $HOME.
          schema: {type: string}
      responses:
        "200":
          description: Directory listing (hidden directories omitted).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FSListing"}
        "400": {$ref: "#/components/responses/Error"}
  /detect:
    get:
      tags: [discovery]
      operationId: detect
      summary: Detect the stack of a directory
      parameters:
        - name: path
          in: query
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Detection result; `ok` is false when nothing was recognised.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: {type: boolean}
                  stack: {type: string}
                  cmd:
                    type: array
                    nullable: true
                    description: "null when nothing was recognised."
                    items: {type: string}
                  prefer_port: {type: integer}
                  kind:
                    type: string
                    enum: ["", native, docker]
                    description: 'Empty when nothing was recognised.'
components:
  parameters:
    Name:
      name: name
      in: path
      required: true
      schema: {type: string}
    PortPath:
      name: port
      in: path
      required: true
      schema: {type: integer}
    Port:
      name: port
      in: query
      description: Force this port instead of the preferred/auto-chosen one.
      schema: {type: integer}
    Force:
      name: force
      in: query
      description: Start even when the port is taken by another listener.
      schema: {type: boolean}
  responses:
    OK:
      description: Done.
      content:
        application/json:
          schema:
            type: object
            required: [ok]
            properties:
              ok: {type: boolean, example: true}
    Error:
      description: Request failed.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Launch:
      description: The unit that was started.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/LaunchResult"}
  schemas:
    Version:
      type: object
      required: [version, api, caddy, docker, systemd]
      properties:
        version: {type: string, example: "0.2.0", description: "pm release that is serving."}
        api:
          type: integer
          example: 1
          description: API generation. A client built for generation N must refuse any other value.
        caddy: {type: boolean, description: "The caddy binary is on PATH, so <name>.localhost routing works."}
        docker: {type: boolean, description: "The docker daemon answers (`docker version` succeeds), so docker projects can start."}
        systemd: {type: boolean, description: "The systemd --user manager is running (or degraded), so pm can launch units."}
    LeaseRequest:
      type: object
      description: Body of `POST /leases`.
      required: [owner]
      properties:
        owner:
          type: string
          example: wt-qa
          description: 'Who the ports are for: letters, digits, `.`, `_` and `-`, starting with a letter or digit, at most 64 characters.'
        count:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
          description: How many ports. 0 or omitted means 1.
        prefer:
          type: integer
          minimum: 0
          maximum: 65535
          description: |
            First port to try. Busy ports are skipped, so the lease may end up
            with higher ones; it fails if `count` ports are not found within
            the next 2000. 0 or omitted starts at 20000.
    RunSpec:
      type: object
      description: Body of `POST /run`.
      required: [name, dir, cmd]
      properties:
        name:
          type: string
          example: api-qa
          description: 'Names the unit (`pm-<name>.service`) and what `pm stop` takes. Letters, digits, `.`, `_` and `-`, starting with a letter or digit, at most 64 characters.'
        dir:
          type: string
          example: /home/me/work/api
          description: Working directory. An absolute path to an existing directory.
        cmd:
          type: array
          minItems: 1
          items: {type: string}
          example: [npm, run, dev]
          description: The program and its arguments, as an argv (no shell).
        env:
          type: object
          additionalProperties: {type: string}
          description: 'Environment variables to add. Names are letters, digits and `_`; `PM_PROJECT` is reserved. Never stored by pm.'
        limits: {$ref: "#/components/schemas/Limits"}
        log:
          type: string
          description: Absolute path of the file stdout and stderr are appended to. Defaults to `~/.pm/logs/<name>.log`.
        owner:
          type: string
          default: local
          description: 'Who the run is for, same grammar as a lease owner. Omitted means `local`.'
        ports:
          type: array
          maxItems: 100
          items: {type: integer, minimum: 1, maximum: 65535}
          description: Ports the process will use. See the operation description.
    RunResult:
      type: object
      required: [unit, pid, ports]
      properties:
        unit: {type: string, example: pm-api-qa.service}
        pid: {type: integer, description: "Main pid systemd reports; 0 if it could not be read."}
        ports:
          type: array
          description: The ports the run holds, as requested. An empty array when none.
          items: {type: integer}
    Lease:
      type: object
      required: [id, owner, ports, created_at]
      properties:
        id: {type: string, example: l-3f9a1c0b7d2e}
        owner: {type: string, example: wt-qa}
        ports:
          type: array
          items: {type: integer}
        created_at: {type: string, format: date-time}
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
    LaunchResult:
      description: |
        Outcome of a start/restart. Field names are capitalised because the Go
        struct has no JSON tags yet; they are part of v1 as they stand today.
      type: object
      properties:
        Project: {type: string}
        Unit: {type: string, description: "systemd unit, pm-<name>.service"}
        Port: {type: integer}
        URL: {type: string}
        Note: {type: string}
    PortStrategy:
      type: object
      properties:
        kind: {type: string, description: "Label: vite, next, django, flutter, env, none."}
        flag: {type: string, example: "--port"}
        env: {type: string, example: PORT}
        template: {type: string, example: "runserver 0.0.0.0:{port}"}
    Limits:
      type: object
      description: |
        Resource caps for the unit pm launches, handed to systemd as
        `MemoryMax=` and `CPUQuota=`. A `memory` cap other than `infinity` also
        sets `MemorySwapMax=0`, so a process that exceeds it is killed by the
        kernel (OOM) instead of being paged out, and its unit ends `failed`
        (the project then reports status `failed`, failure `oom-kill`, in
        `Row`). They need cgroups v2 with the memory and cpu controllers
        delegated to the user manager (`pm doctor` warns when either is
        missing). Omitted or empty means no limit. Values outside the
        documented grammar, and any limit on a `docker` project (the unit only
        wraps the compose client, not the containers), are rejected with 400.
      properties:
        memory:
          type: string
          example: 512M
          description: 'Bytes with an optional K, M, G or T suffix (base 1024), a percentage of physical memory (up to 100%, two decimals at most), or `infinity`. Not zero.'
        cpu:
          type: string
          example: 150%
          description: 'Percentage of one CPU, so `150%` is a core and a half. Above zero, two decimals at most.'
    ProjectInput:
      type: object
      description: |
        Body of `POST /projects`. Only `name` is validated; everything else is
        optional and the daemon stores defaults for `kind` and `tier`. The
        route's response is described by `ProjectEcho`.
      required: [name]
      properties:
        name: {type: string}
        dir: {type: string}
        cmd:
          type: array
          nullable: true
          items: {type: string}
        kind: {type: string, enum: [native, docker], description: "Defaults to native when stored."}
        tier: {type: string, enum: [ephemeral, service], description: "Defaults to ephemeral when stored."}
        prefer_port: {type: integer}
        port_strategy: {$ref: "#/components/schemas/PortStrategy"}
        host: {type: string, description: "<host>.localhost; defaults to name."}
        stack: {type: string}
        auto_restart: {type: boolean}
        group: {type: string}
        limits: {$ref: "#/components/schemas/Limits"}
        draft:
          type: boolean
          description: Produced by scan and not yet confirmed.
    ProjectEcho:
      type: object
      description: |
        Response of `POST /projects`: the request body echoed back as sent,
        before the defaults are applied. `kind` and `tier` therefore come back
        as `""` when the request omitted them, and `cmd` and `port_strategy`
        as `null` and `{}`.
      required: [name]
      properties:
        name: {type: string}
        dir: {type: string}
        cmd:
          type: array
          nullable: true
          items: {type: string}
        kind: {type: string, enum: ["", native, docker], description: 'Empty when the request omitted it.'}
        tier: {type: string, enum: ["", ephemeral, service], description: 'Empty when the request omitted it.'}
        prefer_port: {type: integer}
        port_strategy: {$ref: "#/components/schemas/PortStrategy"}
        host: {type: string}
        stack: {type: string}
        auto_restart: {type: boolean}
        group: {type: string}
        limits: {$ref: "#/components/schemas/Limits"}
        draft: {type: boolean}
    RunInfo:
      type: object
      description: What a run started by `POST /run` keeps. The environment is not part of it.
      properties:
        ports:
          type: array
          items: {type: integer}
        log: {type: string, description: Log file given at start; absent for the default.}
    Project:
      type: object
      description: |
        A project as stored in the registry (defaults applied). Entries with a
        `run` object are processes started by `POST /run`: they live only while
        the process does and are not part of the catalog.
      required: [name, dir, cmd, kind, tier]
      properties:
        owner: {type: string, description: Who the project belongs to; set on runs.}
        run: {$ref: "#/components/schemas/RunInfo"}
        name: {type: string}
        dir: {type: string}
        cmd:
          type: array
          nullable: true
          items: {type: string}
        kind: {type: string, enum: [native, docker]}
        tier: {type: string, enum: [ephemeral, service]}
        prefer_port: {type: integer}
        port_strategy: {$ref: "#/components/schemas/PortStrategy"}
        host: {type: string, description: "<host>.localhost; defaults to name."}
        stack: {type: string}
        auto_restart: {type: boolean}
        group: {type: string}
        limits: {$ref: "#/components/schemas/Limits"}
        draft:
          type: boolean
          description: Produced by scan and not yet confirmed.
    Group:
      type: object
      description: |
        `name` is required by this contract but the daemon does not validate
        it yet: `POST /groups` with `{}` stores a group named `""`. Clients
        must always send a non-empty name.
      required: [name]
      properties:
        name: {type: string}
        projects:
          type: array
          nullable: true
          description: "null when the request omitted it."
          items: {type: string}
    Row:
      type: object
      required: [name, port, url, tier, status, kind]
      properties:
        name: {type: string, description: '"?" for unclaimed listeners.'}
        port: {type: integer}
        url: {type: string, description: "http://<host>.localhost (via proxy)."}
        local_url: {type: string, description: "http://localhost:<port>."}
        tier: {type: string}
        status:
          type: string
          enum: [up, down, failed, unclaimed]
          description: |
            `failed` means systemd still holds the project's unit in the failed
            state, for instance because the kernel killed it for passing its
            memory limit; `failure` says why. Starting or stopping the project
            clears it. A run started by `POST /run` is `up` while its unit is
            active, listening or not.
        failure:
          type: string
          example: oom-kill
          description: 'Present when status is `failed`: the unit''s result as systemd reports it (`oom-kill`, `exit-code`, `signal`...).'
        kind: {type: string}
        stack: {type: string}
        source: {type: string}
        pid: {type: integer}
        unit: {type: string}
        group: {type: string}
        owner: {type: string, description: 'Who a process started by `POST /run` is for.'}
        cmd: {type: string}
        cwd: {type: string}
        docker: {type: boolean}
        draft: {type: boolean}
        system:
          type: boolean
          description: Unmanaged listener with no PID (system/root process).
    FSEntry:
      type: object
      required: [name, path, is_dir]
      properties:
        name: {type: string}
        path: {type: string}
        is_dir: {type: boolean}
        stack: {type: string, description: Detected stack when it is a project directory.}
    FSListing:
      type: object
      required: [path, parent, entries]
      properties:
        path: {type: string}
        parent: {type: string}
        entries:
          type: array
          nullable: true
          items: {$ref: "#/components/schemas/FSEntry"}
