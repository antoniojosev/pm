version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  settings:
    errcheck:
      # Best-effort I/O: closing readers/files, writing to a terminal or an
      # http.ResponseWriter and seeking have nothing useful to recover from.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*os.File).Seek
        - (io.ReadCloser).Close
        - (net.Listener).Close
        - (net.Conn).Close
        - (net/http.ResponseWriter).Write
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Sscanf
        - io.WriteString
  exclusions:
    rules:
      # The "first instance wins" loops in runner.go return on purpose: the
      # first listener on a port is the one pm acts on.
      - path: internal/runner/runner\.go
        linters:
          - staticcheck
        text: SA4004
